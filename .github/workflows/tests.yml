name: Tests

on:
    push:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint & Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  coverage: none

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer downloads
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-lint-${{ hashFiles('composer.json') }}
                  restore-keys: composer-lint-

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction

            - name: Run Pint
              run: composer lint

            - name: Run Larastan
              run: composer analyse

    test:
        name: Test PHP ${{ matrix.php }} with Laravel ${{ matrix.laravel }}
        runs-on: ubuntu-latest
        needs: lint
        strategy:
            fail-fast: false
            matrix:
                php: ["8.3", "8.4", "8.5"]
                laravel: ["12.*", "13.*"]

        steps:
            - uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip
                  coverage: xdebug

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer downloads
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
                  restore-keys: |
                      composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
                      composer-php${{ matrix.php }}-

            - name: Install dependencies
              run: |
                  composer require illuminate/support:${{ matrix.laravel }} \
                    illuminate/contracts:${{ matrix.laravel }} \
                    --prefer-dist --no-interaction --no-update
                  composer update --prefer-dist --no-interaction

            - name: Run tests
              run: ./vendor/bin/pest
